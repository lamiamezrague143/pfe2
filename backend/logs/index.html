<html>
<head>
    <title>iisnode logs</title>
    <style type="text/css">
        body
        {
            font-family: "Trebuchet MS" , Arial, Helvetica, sans-serif;
        }
        table
        {
            border-collapse: collapse;
        }
        td, th
        {
            border: 1px solid lightgray;
            padding: 3px 7px 2px 7px;
        }
        th
        {
            text-align: left;
            padding-top: 5px;
            padding-bottom: 4px;
            background-color: Gray;
            color: #ffffff;
        }
        td.stderr
        {
            color: Red;
        }
    </style>
</head>
<body>
    <table id="logFilesTable">
        <tr>
            <th>
                Computer name
            </th>
            <th>
                PID
            </th>
            <th>
                Type
            </th>
            <th>
                Created
            </th>
            <th>
                Link
            </th>
        </tr>
    </table>
    <p id="lastUpdated"></p>
    <script type="text/javascript">

        // this is replaced with actual data at runtime by code in interceptor.js
        var logFiles = [{"file":"DELLDELAMIA-20304-stderr-1781174889173.txt","computername":"DELLDELAMIA","pid":20304,"type":"stderr","created":1781174889173},{"file":"DELLDELAMIA-20304-stdout-1781174889172.txt","computername":"DELLDELAMIA","pid":20304,"type":"stdout","created":1781174889172},{"file":"DELLDELAMIA-20408-stderr-1781176387606.txt","computername":"DELLDELAMIA","pid":20408,"type":"stderr","created":1781176387606},{"file":"DELLDELAMIA-20408-stdout-1781176387605.txt","computername":"DELLDELAMIA","pid":20408,"type":"stdout","created":1781176387605},{"file":"DELLDELAMIA-21480-stderr-1781173881256.txt","computername":"DELLDELAMIA","pid":21480,"type":"stderr","created":1781173881256},{"file":"DELLDELAMIA-22752-stderr-1781176084495.txt","computername":"DELLDELAMIA","pid":22752,"type":"stderr","created":1781176084495},{"file":"DELLDELAMIA-22752-stdout-1781176084494.txt","computername":"DELLDELAMIA","pid":22752,"type":"stdout","created":1781176084494},{"file":"DELLDELAMIA-24468-stderr-1781173887375.txt","computername":"DELLDELAMIA","pid":24468,"type":"stderr","created":1781173887375},{"file":"DELLDELAMIA-5916-stderr-1781176599798.txt","computername":"DELLDELAMIA","pid":5916,"type":"stderr","created":1781176599798},{"file":"DELLDELAMIA-5916-stdout-1781176599797.txt","computername":"DELLDELAMIA","pid":5916,"type":"stdout","created":1781176599797}];
        var lastUpdated = 1781176601134;
        var date = new Date();

        date.setTime(lastUpdated);
        document.getElementById('lastUpdated').innerHTML = 'Index was last updated ' + date;

        logFiles.sort(function (a, b) {
            return b.created - a.created;
        });

        var logFilesTable = document.getElementById("logFilesTable");
        for (var i = 0; i < logFiles.length; i++) {
            var logFile = logFiles[i];
            date.setTime(logFile.created);
            var row = logFilesTable.insertRow(-1);
            var computerNameCell = row.insertCell(0);
            var pidCell = row.insertCell(1);
            var typeCell = row.insertCell(2);
            var dateCell = row.insertCell(3);
            var logCell = row.insertCell(4);
            computerNameCell.innerHTML = logFile.computername;
            pidCell.innerHTML = logFile.pid.toString();
            typeCell.innerHTML = logFile.type;
            typeCell.setAttribute('class', logFile.type);
            dateCell.innerHTML = date.toString();
            logCell.innerHTML = '<a href="' + logFile.file + '">log</a>';
        };

    </script>
</body>
</html>
